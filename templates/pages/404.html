{% extends "base.html" %}

{% block title %}Page not found — {{ site_name }}{% endblock %}
{% block content %}
<section class="container-x flex items-center justify-center py-24 sm:py-32">
  <div class="max-w-lg text-center">
    <p class="text-7xl font-extrabold tracking-tight text-forest-700 sm:text-8xl">404</p>
    <h1 class="mt-4 text-2xl font-bold tracking-tight text-ink-950">This page took a different path</h1>
    <p class="mt-2 text-sm text-ink-500">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a href="{% url 'jobs:home' %}" class="btn btn-primary">Back to home</a>
      <a href="{% url 'jobs:job_list' %}" class="btn btn-outline">Browse jobs</a>
    </div>
  </div>
</section>
{% endblock %}
