<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong — Resuma.pk</title>
  <style>
    :root { --ink:#0b1310; --forest:#094b3a; --gold:#c49c3e; --paper:#f6f7f3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--paper); color:var(--ink); }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 20px; }
    .card { max-width:32rem; text-align:center; }
    .code { font-size:5.5rem; font-weight:800; letter-spacing:-0.03em; color:var(--gold); line-height:1; }
    h1 { margin:16px 0 8px; font-size:1.6rem; font-weight:700; }
    p { margin:0 0 28px; color:#4a5f56; font-size:.95rem; }
    .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a { text-decoration:none; padding:12px 22px; border-radius:12px; font-weight:600; font-size:.9rem; }
    .primary { background:var(--forest); color:#fff; }
    a:hover { opacity:.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="code">500</p>
      <h1>Something went wrong on our side</h1>
      <p>An unexpected error occurred. Our team has been notified — please try again in a moment.</p>
      <div class="btns">
        <a class="primary" href="/">Back to home</a>
      </div>
    </div>
  </div>
</body>
</html>
